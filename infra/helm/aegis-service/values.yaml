nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: example/aegis-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: aegis-service

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env: []

readinessProbe:
  path: /health/ready
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /health/live
  initialDelaySeconds: 10
  periodSeconds: 20

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

