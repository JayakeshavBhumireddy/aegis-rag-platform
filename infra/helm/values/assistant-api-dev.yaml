# Generated by scripts/infra/generate_helm_values.py. Do not edit by hand.
nameOverride: assistant-api

image:
  repository: example/assistant-api
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

env:
  - name: AEGIS_ASSISTANT_DEPENDENCY_MODE
    value: "http"
  - name: AEGIS_AUTH_DEV_SECRET
    value: "aegis-local-dev-secret"
  - name: AEGIS_CONTEXT_URL
    value: "http://context-service:8000"
  - name: AEGIS_ENTITLEMENT_URL
    value: "http://entitlement-service:8000"
  - name: AEGIS_LLM_GATEWAY_URL
    value: "http://llm-gateway:8000"
  - name: AEGIS_OBSERVABILITY_URL
    value: "http://observability-service:8000"
  - name: AEGIS_POLICY_URL
    value: "http://policy-service:8000"
  - name: AEGIS_RETRIEVAL_URL
    value: "http://retrieval-service:8000"
  - name: AEGIS_SERVICE_APP
    value: "assistant_api.main:app"
  - name: AEGIS_VERIFICATION_URL
    value: "http://verification-service:8000"
  - name: PORT
    value: "8000"

readinessProbe:
  path: /health/ready

livenessProbe:
  path: /health/live
