name: evals

on:
  pull_request:
    paths:
      - "configs/prompts/**"
      - "configs/policies/**"
      - "configs/routing/**"
      - "configs/schemas/**"
      - "data/catalog/**"
      - "scripts/data/**"
      - "scripts/validation/**"
      - ".github/workflows/evals.yml"

jobs:
  eval-contracts:
    name: Eval contract checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configs
        run: python scripts/validation/validate_configs.py

      - name: Generate synthetic corpus
        run: python scripts/data/generate_synthetic_corpus.py

