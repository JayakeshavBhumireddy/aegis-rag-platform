name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON and YAML
        run: python scripts/validation/validate_configs.py

      - name: Validate repo hygiene
        run: python scripts/validation/check_repo_hygiene.py

