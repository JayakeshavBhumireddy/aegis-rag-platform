name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Run release gate
        run: python scripts/validation/run_release_gate.py
