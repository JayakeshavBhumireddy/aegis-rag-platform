name: terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"

jobs:
  terraform-dev:
    name: Terraform dev validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform format check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir=infra/terraform/envs/dev init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/envs/dev validate

